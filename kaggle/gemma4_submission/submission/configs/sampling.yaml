# Tasks get ~4.5 minutes each, so tokens are time: keep thinking short and outputs
# small. Low temperature for repeatable edits. Thinking stays on (the harness serves
# with enable_thinking) but capped well below the output limit so a tool call is
# never cut off.
temperature: 0.2
top_p: 0.95
max_output_tokens: 4096
thinking_config:
  include_thoughts: true
  thinking_budget: 1024
