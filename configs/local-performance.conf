[Service]
TimeoutStartSec=180
# Keep loaded models resident forever (weights are mmapped by default; never evicted by idle timeout).
Environment="OLLAMA_KEEP_ALIVE=-1"
Environment="OLLAMA_NO_CLOUD=1"
# Room for the main model plus one small specialist, so neither evicts the other.
Environment="OLLAMA_MAX_LOADED_MODELS=2"
# One model serves chat and project work: switching names would reload the weights.
ExecStartPost=/usr/bin/python3 %h/Projects/NESSA/scripts/warm_chat.py --model nessa-lfm-32k:latest --url http://127.0.0.1:11435
